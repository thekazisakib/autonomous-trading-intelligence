[project]
name = "ai-trading-system"
version = "0.2.0"
description = "Safe realtime entry/exit trading system for Indian equities"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "websockets>=14.0",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
rl = [
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
]
dashboard = [
    "streamlit>=1.37.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov=config --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "S", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
config_version: "1.0"

broker:
  provider: "angel"
  api_key_env: "ANGEL_API_KEY"
  api_secret_env: "ANGEL_PIN"
  client_id_env: "ANGEL_CLIENT_ID"
  totp_secret_env: "ANGEL_TOTP_SECRET"
  base_url: "https://apiconnect.angelone.in"
  websocket_url: "wss://smartapisocket.angelone.in/smart-stream"
  instrument_master_url: "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"
  rate_limit_per_second: 3
  daily_api_call_limit: 1000

risk:
  max_daily_loss_pct: 1.0
  max_drawdown_pct: 5.0
  max_position_per_stock_pct: 10.0
  max_sector_exposure_pct: 30.0
  max_order_value_inr: 50000.0
  max_orders_per_day: 50
  data_stale_halt_seconds: 30
  broker_disconnect_halt_seconds: 60
  skip_first_15_min: true
  skip_last_15_min: true
  allowed_start_time: "09:30"
  allowed_end_time: "15:15"

trading:
  universe: ["RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK"]
  exchange: "NSE"
  product_type: "MIS"
  order_type: "LIMIT"
  default_quantity: 1
  market_data_enabled: true
  analysis_interval_minutes: 5
  paper_trading: true
  auto_execute: false
  paper_starting_capital_inr: 500000
  paper_slippage_bps: 5
  paper_cost_bps: 20

strategy:
  type: "deterministic"
  entry_rsi_threshold: 30.0
  exit_rsi_threshold: 70.0
  min_volume_surge_pct: 50.0
  stop_loss_pct: 2.0
  take_profit_pct: 4.0
  max_holding_days: 5
  thesis_weight: 0.1

rl:
  enabled: false
  shadow_mode: false
  model_type: "ppo"
  model_path: "models/ppo_v1"
  policy_version: "ppo_v1"
  confidence_threshold: 0.7

forecast:
  enabled: true
  model_type: "linear_trend_shadow"
  horizon_bars: 3
  lookback_bars: 20
  minimum_confidence: 0.15

research:
  enabled: True
  mcp_server_timeout_seconds: 10
  langgraph_checkpoint_db: "data/langgraph_checkpoints.sqlite"
  thesis_refresh_minutes: 240
  mcp_servers: ["nse_scraper", "financial_db", "news_rss"]

quality_gate:
  enabled: true
  max_staleness_seconds: 30
  check_circuit_filters: true
  check_price_sanity: true
  check_volume_surge: true
  circuit_buffer_pct: 0.5

observability:
  log_level: "INFO"
  audit_path: "audit/audit.jsonl"
  db_path: "data/trading.db"
  alert_telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
  alert_chat_id_env: "TELEGRAM_CHAT_ID"

telegram_control:
  enabled: true
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"
  allowed_user_id_env: "TELEGRAM_ALLOWED_USER_ID"
  approval_timeout_seconds: 120
  max_approval_price_change_pct: 0.25

agentic:
  enabled: true
  llm_provider: "gemini"
  model_name: "gemini-3.5-flash-lite"
  model_path: "models/phi-3-mini"
  api_key_env: "GEMINI_API_KEY_ROTATED"
  analysis_interval_seconds: 900
  request_timeout_seconds: 15
  max_tokens: 512
  temperature: 0.3
  thesis_weight: 0.2  # How much the thesis affects decisions
